<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" fill="none">
  <!-- Card Container with 24px Squircle Radius -->
  <rect x="2" y="2" width="956" height="296" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Subtle Dot Grid in Background -->
  <defs>
    <pattern id="grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#E2E8F0" />
    </pattern>
  </defs>
  <rect x="20" y="20" width="920" height="260" rx="16" fill="url(#grid-light)" opacity="0.6"/>

  <!-- Brand Mark Icon Box (72x72) -->
  <g transform="translate(64, 60)">
    <rect width="72" height="72" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
        <!-- Codindex mark: index spine with three branching entries -->
    <g stroke="#0284C7" stroke-linecap="round" fill="none">
      <line x1="20" y1="20" x2="20" y2="52" stroke-width="2.5" opacity="0.5"/>
      <circle cx="20" cy="20" r="3.4" fill="#0284C7" stroke="none"/>
      <circle cx="20" cy="36" r="3.4" fill="#0284C7" stroke="none"/>
      <circle cx="20" cy="52" r="3.4" fill="#0284C7" stroke="none"/>
      <line x1="23.5" y1="20" x2="31" y2="20" stroke-width="2" opacity="0.8"/>
      <line x1="23.5" y1="36" x2="31" y2="36" stroke-width="2" opacity="0.8"/>
      <line x1="23.5" y1="52" x2="31" y2="52" stroke-width="2" opacity="0.8"/>
    </g>
    <g fill="#0284C7">
      <rect x="31" y="16.6" width="25" height="6.8" rx="3.4" opacity="0.95"/>
      <rect x="31" y="32.6" width="14" height="6.8" rx="3.4" opacity="0.65"/>
      <rect x="31" y="48.6" width="20" height="6.8" rx="3.4" opacity="0.82"/>
    </g>

  </g>

  <!-- Typography: Wordmark & Core Tagline -->
  <text x="156" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0F172A" letter-spacing="-1">Codindex</text>
  
  <text x="156" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B">Structural code index for AI agents — AST graphs, call chains, module deps</text>

  <!-- Divider Line -->
  <line x1="64" y1="180" x2="896" y2="180" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Bottom Badges / Tech Capabilities -->
  <g transform="translate(64, 210)">

    <!-- Pill: 32 MCP Tools -->
    <rect x="0" y="0" width="143" height="34" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="16" cy="17" r="4" fill="#0284C7"/>
    <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0369A1">32 MCP Tools</text>
        

    <!-- Pill: 6 Languages -->
    <rect x="155" y="0" width="137" height="34" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="171" cy="17" r="4" fill="#0284C7"/>
    <text x="183" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0369A1">6 Languages</text>
        

    <!-- Pill: Tree-sitter AST -->
    <rect x="304" y="0" width="167" height="34" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="320" cy="17" r="4" fill="#0284C7"/>
    <text x="332" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0369A1">Tree-sitter AST</text>
        

    <!-- Pill: Local-First -->
    <rect x="483" y="0" width="133" height="34" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="499" cy="17" r="4" fill="#0284C7"/>
    <text x="511" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0369A1">Local-First</text>
        
    <!-- Right Side Protocol Tag -->
    <text x="832" y="22" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13" font-weight="500" fill="#64748B">v1.0.0 · MIT</text>
  </g>
</svg>